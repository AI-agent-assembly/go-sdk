name: Docs Metadata

# AAASM-4311: enforce that generated Go docs metadata (internal/version/
# metadata.go and the README's `sdk-metadata` bounded block) is up to date
# with metadata/sdk.yaml, go.mod, and VERSION. The check runs on every PR and
# on push to master, and DOES NOT skip on `**/*.md` because the README block
# is one of the enforced surfaces.
#
# AAASM-4515: `go generate ./...` also drives scripts/gen-quickstart-tabs.go,
# so the `quickstart-tabs` bounded block in docs/quick-start.md is likewise
# drift-checked here against its vendored source (metadata/quickstart/).

on:
  pull_request:
    paths-ignore:
      - "LICENSE"
  push:
    paths-ignore:
      - "LICENSE"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# AAASM-3993: least-privilege default token — this workflow only checks out
# and runs `go generate` + a diff check; no job pushes, comments, or deploys.
permissions:
  contents: read

jobs:
  verify-generated:
    runs-on: ubuntu-latest

    env:
      # AAASM-4709: pin this job onto the go1.26.6 toolchain, the same one
      # govulncheck.yml/release.yml's security-gate already force (see the
      # AAASM-4634 comment there). Without this, `go` resolves to whatever
      # actions/setup-go's `go-version: "1.26.x"` cached (the 1.26.4 toolcache)
      # and `go mod download`/`go generate` run outbound TLS on a stdlib still
      # vulnerable to GO-2026-5856.
      GOTOOLCHAIN: go1.26.6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Verify modules
        run: |
          go mod download
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run generator
        run: go generate ./...

      - name: Assert generated docs metadata is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated docs metadata is stale. Run 'go generate ./...' and commit the result."
            exit 1
          fi

      # AAASM-5529. The generator check above round-trips the quickstart-tabs
      # block as TEXT: it proves the committed doc matches metadata/quickstart/
      # and nothing more — the .go.txt fragments are never compiled or run.
      #
      # This step gates a different surface: the prose in the WrapTools section
      # and "What to expect", where the quick-start states what governance does.
      # Each claim is bound to the control that proves it.
      #
      # It runs HERE rather than only in go-test.yml because that workflow sets
      # paths-ignore on docs/** and **/*.md, so a docs-only PR — precisely the
      # change that rewords a claim — runs no Go tests at all. This workflow
      # ignores only LICENSE, so it sees every PR.
      - name: Every documented enforcement claim names the control that proves it
        run: |
          go test ./assembly/ -run 'TestClaimGateCanSeeWhatItGates|TestEveryDocumentedClaimIsBound|TestEveryBindingNamesSomethingReal|TestTheDocumented' -v
